name: Apply qualified Preset Discovery bridge patch

on:
  push:
    branches:
      - feat-preset-discovery-bridge

permissions:
  contents: write

jobs:
  apply-qualified-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact qualified patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'presetBridgeMutex' source/_generic/wclap-module.h; then
            echo 'qualified patch already present'
            exit 0
          fi

          mkdir -p .ci/patch-tools
          base='https://raw.githubusercontent.com/hemduf/webview-gui/83e826b23e6c6541aa854311dd9e915f17967344/.github/scripts'
          for script in \
            apply_wclap_preset_discovery_upstream.py \
            patch_wclap_preset_discovery_bridge.py \
            patch_wclap_preset_discovery_thread_safety.py \
            patch_wclap_preset_null_semantics.py
          do
            curl --fail --location --retry 3 --silent --show-error \
              "$base/$script" -o ".ci/patch-tools/$script"
          done

          python3 .ci/patch-tools/apply_wclap_preset_discovery_upstream.py \
            --bridge-module source/_generic/wclap-module.h \
            --emit-patch .ci/wclap-preset-discovery.patch

          test "$(git hash-object source/_generic/wclap-module.h)" = 'e568c9a14fb75e07da4d417ad47d4582ce61ac05'

          git checkout -- source/_generic/wclap-module.h
          git apply --check .ci/wclap-preset-discovery.patch
          git apply .ci/wclap-preset-discovery.patch
          git diff --check
          test "$(git hash-object source/_generic/wclap-module.h)" = 'e568c9a14fb75e07da4d417ad47d4582ce61ac05'

      - name: Commit qualified bridge
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source/_generic/wclap-module.h; then
            echo 'nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/_generic/wclap-module.h
          git commit -m 'feat: bridge CLAP Preset Discovery factory'
          git push origin HEAD:feat-preset-discovery-bridge
